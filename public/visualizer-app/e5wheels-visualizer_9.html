/*
 * Real shop links per generation/style/finish, sourced from the actual
 * buildWheelUrl() calls already documented on the site's own generation
 * pages (src/pages/generations/**) - see ai/VISUALIZER_MIGRATION_NOTES.md.
 * Loaded from fitment-catalog.json rather than hardcoded here so it can be
 * regenerated without touching this file. Empty/missing entries (e.g.
 * C8_Z06, whose real products are Talladega/Sonoma, not Daytona/Sebring/
 * Speedway) mean every combo for that generation falls through to the
 * quote-request form below.
 */
let FITMENT_CATALOG={};
async function loadFitmentCatalog(){
  try{
    const res=await fetch('fitment-catalog.json');
    if(res.ok)FITMENT_CATALOG=await res.json();
  }catch(e){console.warn('Failed to load fitment-catalog.json; shop links will fall back to quote requests.',e);}
}

/*
 * The finish dropdown uses one simplified label per swatch across every
 * wheel style, but the real catalog sometimes uses a different name for
 * the same physical finish on a specific style (e.g. Speedway's bronze
 * finish is a distinct "Dark Bronze" product, and "Titanium" here can be
 * either "Titanium Brushed" or "Titanium Brushed Tint" depending on
 * generation) - same root cause as the finish-name-mismatch bugs already
 * fixed on the shop pages themselves. Try each candidate name in order.
 */
const FINISH_ALIASES={
  'Titanium':['Titanium Brushed','Titanium Brushed Tint'],
  'Bronze Brushed Tint':['Bronze Brushed Tint','Dark Bronze'],
};
function candidateFinishes(finish){
  return FINISH_ALIASES[finish]||[finish];
}
function findShopUrl(genKey,style,finish){
  const entry=FITMENT_CATALOG[genKey];
  if(!entry)return null;
  for(const candidate of candidateFinishes(finish)){
    const match=entry.combos.find(c=>c.style===style&&c.finish===candidate);
    if(match)return match.url;
  }
  return null;
}
function updateShopLink(){
  const url=findShopUrl(curGen,curWheel,curWC);
  if(url){
    cpShop.href=url;
    cpShop.textContent='SHOP THIS FITMENT →';
    cpShop.classList.remove('d-shop-quote');
    return;
  }
  const entry=FITMENT_CATALOG[curGen];
  const gd=GENS[curGen];
  const params=new URLSearchParams({
    series:curWheel,
    finish:curWC,
    generation:entry?entry.generation:'',
    trim:entry?entry.trim:'',
    label:gd?gd.label:'',
  });
  cpShop.href='https://www.e5wheels.com/request-quote?'+params.toString();
  cpShop.textContent='REQUEST A QUOTE →';
  cpShop.classList.add('d-shop-quote');
}

let curGen='C5', curWheel='Daytona', curWC='Bronze Brushed Tint', curPaint='Torch Red', curCal='Torch Red';
const $=id=>document.getElementById(id);

const enc=s=>s.split('/').map(encodeURIComponent).join('/');
/*
 * index.php's own color dropdown/path logic remaps a couple of dropdown
 * names to different actual folder names on disk, but in two different
 * ways that must not be conflated:
 *  - Every generation's Speedway folder is plain "Bronze", not "Bronze
 *    Brushed Tint" like Daytona/Sebring. index.php's own <select> actually
 *    swaps its option value to "Bronze" for Speedway (see
 *    populateWheelColorOptions), so both the file path AND whatever value
 *    we drive() into that <select> need this mapping.
 *  - C8_Z06's Daytona folder is misspelled "Hypee Silver" instead of
 *    "Hyper Silver", but index.php's <select> keeps the option value as
 *    "Hyper Silver" always - only the file-path builder
 *    (wheelColorForCarPaths) substitutes the typo'd name afterward. Driving
 *    the iframe's dropdown with "Hypee Silver" would set it to a
 *    nonexistent option and desync it (silently falling back to Bronze),
 *    so this correction belongs ONLY in the path builder, never in drive().
 */
function wcForStyle(w,wc){return (w==='Speedway'&&wc==='Bronze Brushed Tint')?'Bronze':wc;}
function wcForPath(g,w,wc){
  const styled=wcForStyle(w,wc);
  if(g==='C8_Z06'&&w==='Daytona'&&styled==='Hyper Silver')return 'Hypee Silver';
  return styled;
}
function mUrl(w,wc){const p=WMAIN[w]&&WMAIN[w][wc];return p?BASE+'/wheelsMain/'+enc(p)+'.webp':'';}
function bUrl(g,c,n){return BASE+'/'+g+'/Body/'+enc(c)+'/'+n+'.webp';}
function wUrl(g,w,wc,n){return BASE+'/'+g+'/Wheels/'+enc(w)+'/'+enc(wcForPath(g,w,wc))+'/'+n+'.webp';}
function wheelMaskUrl(g,w,n){return BASE+'/'+g+'/Wheels/'+enc(w)+'/Masks/'+n+'.webp';}
function caliperMaskUrl(g,n){return BASE+'/'+g+'/Masks/'+n+'.webp';}

// Drive iframe (relative src keeps this same-origin as long as index.php
// ships alongside this file - do not change vizFrame's src back to an
// absolute cross-origin URL, or every control below silently stops working)
function drive(id,val){
  try{const d=frame.contentDocument||frame.contentWindow.document;const e=d.getElementById(id);if(e){e.value=val;e.dispatchEvent(new Event('change',{bubbles:true}));}}catch(e){}
}

// Thumbnails - full-width bottom bar, driven by clicking the corresponding
// (hidden but still functional) thumbnail inside index.php via cross-frame
// access. Layered + luminance-masked the same way index.php's own
// thumbnails are, so caliper/wheel color changes actually show here.
function buildThumbs(){
  const gd=GENS[curGen];

function refreshThumbs(){

// Load gen

/*
 * Size the car image column from the sidebar's own natural height instead
 * of the iframe's own content height - sizing from content left the image
 * capped at a guessed number, with the sidebar (usually taller) leaving its
 * own extra height as a dead black gap below the image (see
 * "is-embedded .main-image-container" in gallery.css, which fills 100% of
 * whatever height this gives it).
 *
 * On desktop (side-by-side) widths that natural sidebar height can still
 * exceed what actually fits under the nav/tabs/thumb strip on a real,
 * chrome-shrunk browser viewport, which used to force the whole page to
 * scroll a little even though the design's whole point was "no scroll
 * needed". Cap the row to whatever height truly fits and let the sidebar's
 * OWN content scroll internally instead (.config-col has overflow-y:auto)
 * - config-col.scrollHeight always reports the content's real wanted
 * height regardless of any constraint already applied, so this is safe to
 * recompute repeatedly. On stacked/mobile widths (top-row is column, not
 * row) a full-page scroll is the normal, expected pattern, so this leaves
 * the row unconstrained there and only sizes the image from the sidebar's
 * natural height like before.
 */
const configCol=document.querySelector('.config-col');
const topRowEl=document.querySelector('.top-row');
const heroRowEl=document.querySelector('.mobile-hero-row');
const iframeWrapEl=document.querySelector('.iframe-wrap');
const navEl=document.querySelector('.e5-nav');
const tabsEl=document.querySelector('.gen-bar');

/*
 * On stacked/mobile widths the thumb strip should sit right under the car
 * image, not after the whole config panel - but on desktop it needs to
 * stay a full-width strip below BOTH columns, which only works as a
 * sibling of .top-row (a child of .top-row would render as a third
 * side-by-side column there instead). CSS alone can't reorder across that
 * different-parent boundary, so move the actual DOM node between the two
 * positions based on the same breakpoint top-row's own stacking uses.
 */
const mobileLayoutQuery=window.matchMedia('(max-width:768px)');
function placeThumbStrip(){
  if(!thumbStripWrap||!heroRowEl||!topRowEl)return;
  if(mobileLayoutQuery.matches){
    if(thumbStripWrap.previousElementSibling!==heroRowEl)heroRowEl.insertAdjacentElement('afterend',thumbStripWrap);
  } else if(thumbStripWrap.previousElementSibling!==topRowEl){
    topRowEl.insertAdjacentElement('afterend',thumbStripWrap);
  }
}

/*
 * On mobile, #wsGrid (the wheel style thumbnails) moves into .mobile-hero-row
 * ahead of .iframe-wrap, becoming a narrow vertical rail beside the image
 * instead of a row sitting under the whole config panel below. On desktop
 * it moves back to its original spot ahead of the wheel-prev image inside
 * config-col's first .d-sec.
 */
function placeWsGrid(){
  if(!wsGrid||!heroRowEl||!iframeWrapEl||!wheelPrev)return;
  if(mobileLayoutQuery.matches){
    if(wsGrid.parentElement!==heroRowEl)heroRowEl.insertBefore(wsGrid,iframeWrapEl);
  } else if(wsGrid.nextElementSibling!==wheelPrev||wsGrid.parentElement!==wheelPrev.parentElement){
    wheelPrev.parentElement.insertBefore(wsGrid,wheelPrev);
  }
}

/*
 * On mobile, #fpcRow (Finish/Paint/Caliper) moves out of .config-col to sit
 * right after the thumbnail strip, ahead of the Wheel Style section - so a
 * visitor can change finish/paint/caliper without first scrolling past the
 * whole wheel-style preview. On desktop it moves back to its original spot
 * inside .config-col, right before the Shop button's .d-sec.
 */
function placeFpcRow(){
  if(!fpcRow||!thumbStripWrap||!configCol||!cpShop)return;
  const shopSection=cpShop.closest('.d-sec');
  if(mobileLayoutQuery.matches){
    if(fpcRow.previousElementSibling!==thumbStripWrap)thumbStripWrap.insertAdjacentElement('afterend',fpcRow);
  } else if(shopSection && fpcRow.nextElementSibling!==shopSection){
    configCol.insertBefore(fpcRow,shopSection);
  }
}

/*
 * Fade + arrow hint over the right edge of a horizontally-scrolling row
 * (gen tabs, thumbnails) - shown only while there's actually more content
 * past the visible edge, hidden once scrolled to the end. Returns the
 * update function so callers can re-check it after content that affects
 * scrollWidth changes (e.g. rebuilding thumbnails for a new generation).
 */
function initScrollFade(scrollEl,fadeEl){
  if(!scrollEl||!fadeEl)return()=>{};
  function update(){
    const hasOverflow=scrollEl.scrollWidth>scrollEl.clientWidth+2;
    const atEnd=scrollEl.scrollLeft+scrollEl.clientWidth>=scrollEl.scrollWidth-2;
    fadeEl.classList.toggle('visible',hasOverflow&&!atEnd);
  }
  scrollEl.addEventListener('scroll',update,{passive:true});
  window.addEventListener('resize',update);
  update();
  return update;
}
const updateGenBarFade=initScrollFade(genBar,genBarFade);
const updateThumbFade=initScrollFade(thumbStrip,thumbFade);

function layoutTopRow(){
  if(!configCol||!topRowEl)return;
  placeThumbStrip();
  placeFpcRow();
  placeWsGrid();
  updateGenBarFade();
  updateThumbFade();
  const natural=configCol.scrollHeight;
  const isRow=getComputedStyle(topRowEl).flexDirection==='row';
  if(!isRow){
    /*
     * Stacked/mobile: the image is now its own full-width strip, unrelated
     * to the sidebar sitting below it, so sizing its height from the
     * sidebar's height (as the side-by-side desktop case does) produced a
     * tall, narrow box on a narrow phone screen. object-fit:cover then had
     * to zoom in heavily to fill that box, cropping past the wheels
     * entirely. Use the car photos' actual 16:9 ratio against the image
     * column's own current width instead, same as the page's un-embedded
     * default ratio - cover then only trims a little off the sides/top
     * instead of zooming in.
     */
    topRowEl.style.height='';
    const w=iframeWrapEl?iframeWrapEl.clientWidth:window.innerWidth;
    if(w>0)frame.style.height=Math.round(w*9/16)+'px';
    return;
  }
  const chrome=(navEl?navEl.offsetHeight:0)+(tabsEl?tabsEl.offsetHeight:0)+(thumbStrip?thumbStrip.offsetHeight:0);
  const available=Math.max(320,window.innerHeight-chrome);
  const h=Math.max(400,Math.min(natural||available,available));
  topRowEl.style.height=h+'px';
  frame.style.height=h+'px';
}
let resizeRaf=null;
window.addEventListener('resize',()=>{
  if(resizeRaf)cancelAnimationFrame(resizeRaf);
  resizeRaf=requestAnimationFrame(layoutTopRow);
});

frame.addEventListener('load',()=>{
  layoutTopRow();
  setTimeout(()=>loader.classList.add('hidden'),300);
  drive('wheelColor',wcForStyle(curWheel,curWC));
  drive('exteriorPaint',curPaint);
  drive('brakeCalipers',curCal);
  driveWheelBtn(curWheel);
});
setTimeout(()=>loader.classList.add('hidden'),6000);

document.querySelectorAll('.gtab').forEach(b=>b.addEventListener('click',()=>loadGen(b.dataset.gen)));
(async()=>{
  await loadFitmentCatalog();
  loadGen('C5');
})();
